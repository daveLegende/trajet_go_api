services:
  postgres:
    image: postgres:16-alpine
    container_name: trajetgo_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: trajetgo
      POSTGRES_PASSWORD: trajetgo
      POSTGRES_DB: trajetgo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trajetgo -d trajetgo']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
